# Overrides on top of detekt's default configuration (buildUponDefaultConfig).
# Keep this list short and justify every entry.

build:
  maxIssues: 0

config:
  validation: true
  warningsAsErrors: true

naming:
  FunctionNaming:
    # Composables are PascalCase by Compose API guidelines.
    ignoreAnnotated:
      - Composable

complexity:
  LongMethod:
    # Compose screens read top to bottom; splitting them only to satisfy a line count hurts.
    ignoreAnnotated:
      - Composable
  TooManyFunctions:
    thresholdInInterfaces: 16
    thresholdInClasses: 16
    ignoreOverridden: true
    excludes:
      - '**/test/**'
      - '**/androidTest/**'
  LongParameterList:
    # Composables expose many optional parameters with defaults.
    ignoreDefaultParameters: true
    excludes:
      - '**/test/**'
      - '**/androidTest/**'
      # Canvas drawing helpers pass the scope, the key and the look explicitly.
      - '**/surface/SurfaceRenderer.kt'

style:
  MaxLineLength:
    # Test fixtures embed long JSON literals.
    excludes:
      - '**/test/**'
      - '**/androidTest/**'
  ThrowsCount:
    # Parsers and validators reject input in many distinct ways.
    max: 8
  ReturnCount:
    max: 4
    excludeGuardClauses: true
  UnusedPrivateMember:
    # Private @Preview functions are only referenced by the IDE.
    ignoreAnnotated:
      - Preview
  MagicNumber:
    excludes:
      - '**/test/**'
      - '**/androidTest/**'
      - '**/*.kts'
      # Icon geometry and color tokens are literal values by nature.
      - '**/surface/SurfaceRenderer.kt'
      - '**/surface/TempStyle.kt'
      - '**/style/Style.kt'
      - '**/style/Presets.kt'
      - '**/surface/KeyboardSurface.kt'
