name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Dependabot PRs are built by dependabot-verification.yml, which first
    # refreshes gradle/verification-metadata.xml.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      # Also validates the Gradle wrapper checksum.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Check and build
        run: ./gradlew check assembleDebug

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports
          path: |
            */build/reports/
            build/reports/
          retention-days: 14

  emulator-tests:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # Android emulators need KVM, which is off by default on GitHub runners.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The `tiny` model is only used by the whisper JNI test; it is never committed. The cache key
      # is the pinned SHA-256, so a changed pin invalidates the cache and the download is verified.
      - name: Cache the Whisper tiny test model
        id: whisper-model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/whisper-test
          key: whisper-tiny-q5_1-818710568da3ca15689e31a743197b520007872ff9576237bda97bd1b469c3d7

      - name: Download the Whisper tiny test model
        if: steps.whisper-model.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/whisper-test"
          curl -fsSL --retry 3 -o "$HOME/whisper-test/model.bin" \
            "https://huggingface.co/ggerganov/whisper.cpp/resolve/5359861c739e955e79d9a303bcbc70fb988958b1/ggml-tiny-q5_1.bin"
          echo "818710568da3ca15689e31a743197b520007872ff9576237bda97bd1b469c3d7  $HOME/whisper-test/model.bin" | sha256sum -c -

      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          script: |
            ./gradlew installFullDebug installFullDebugAndroidTest
            adb shell mkdir -p /data/local/tmp/ukwhisper
            adb push $HOME/whisper-test/model.bin /data/local/tmp/ukwhisper/model.bin
            adb push third_party/whisper.cpp/samples/jfk.wav /data/local/tmp/ukwhisper/sample.wav
            adb shell chmod -R a+rX /data/local/tmp/ukwhisper
            adb shell "run-as com.qtekfun.ultimatekeys sh -c 'mkdir -p files/whisper-test'"
            adb shell "run-as com.qtekfun.ultimatekeys sh -c 'cat > files/whisper-test/model.bin' < /data/local/tmp/ukwhisper/model.bin"
            adb shell "run-as com.qtekfun.ultimatekeys sh -c 'cat > files/whisper-test/sample.wav' < /data/local/tmp/ukwhisper/sample.wav"
            ./gradlew connectedFullDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.requireWhisper=true

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: emulator-reports
          path: |
            */build/reports/androidTests/
          retention-days: 14

  reproducible-build:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Two clean checkouts in different directories: the unsigned release APKs must be identical.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
          path: build-a

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
          path: build-b

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build twice
        run: |
          for dir in build-a build-b; do
            (cd "$dir" && ./gradlew --no-daemon --no-build-cache assembleFullRelease assembleLiteRelease)
          done

      - name: Compare the APKs
        run: |
          status=0
          for flavor in full lite; do
            a="build-a/app/build/outputs/apk/$flavor/release/app-$flavor-release-unsigned.apk"
            b="build-b/app/build/outputs/apk/$flavor/release/app-$flavor-release-unsigned.apk"
            if cmp -s "$a" "$b"; then
              echo "$flavor: identical"
            else
              echo "::error::$flavor release APKs differ between two clean builds"
              status=1
            fi
          done
          exit $status
