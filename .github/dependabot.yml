# Version updates. Security updates are switched on in the repository settings and ignore this file's
# schedule. The "Dependabot verification" workflow refreshes gradle/verification-metadata.xml on these
# pull requests, then CI runs the full gate on them.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 6
    labels: [dependencies]
    # A group is one pull request. Families that must move together share one; the first group a
    # dependency matches wins, so the catch-all stays last.
    groups:
      kotlin:
        patterns: ["org.jetbrains.kotlin*", "com.google.devtools.ksp*", "org.jetbrains.kotlinx*"]
      androidx:
        patterns: ["androidx.*"]
      android-build:
        patterns: ["com.android*", "io.gitlab.arturbosch.detekt*", "com.diffplug.spotless*"]
      testing:
        patterns: ["junit*", "org.junit*", "org.robolectric*", "io.github.takahirom*", "app.cash.turbine*"]
      other:
        patterns: ["*"]
    commit-message:
      prefix: build

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Madrid
    labels: [dependencies]
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  # whisper.cpp is pinned to a release tag on purpose: a proposed bump to a newer commit is reviewed by
  # hand and moved to the matching tag (see docs/THIRD_PARTY.md) before it is merged.
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies]
    commit-message:
      prefix: build
